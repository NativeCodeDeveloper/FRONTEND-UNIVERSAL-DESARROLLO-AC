<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sin conexión — Agenda Clínica</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", system-ui, sans-serif;
      background: #FAFAFB;
      color: #0f172a;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .icon {
      width: 72px;
      height: 72px;
      border-radius: 20px;
      background: #F3F0FF;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
    }
    .icon svg { width: 36px; height: 36px; color: #6E56CF; }
    h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; color: #0f172a; }
    p {
      margin-top: 10px;
      font-size: 14px;
      color: #64748b;
      line-height: 1.6;
      max-width: 320px;
    }
    .badge {
      margin-top: 24px;
      display: inline-block;
      background: #FEF3C7;
      color: #92400e;
      border: 1px solid #FDE68A;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
    }
    button {
      margin-top: 28px;
      padding: 12px 28px;
      background: #6E56CF;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #5b45bc; }
  </style>
</head>
<body>
  <div class="icon">
    <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
      <path stroke-linecap="round" stroke-linejoin="round"
        d="M3 15a4 4 0 004 4h9a5 5 0 10-.1-9.999 5.002 5.002 0 10-9.78 2.096A4.001 4.001 0 003 15z" />
    </svg>
  </div>
  <h1>Sin conexión</h1>
  <p>Los datos clínicos de pacientes requieren conexión activa a internet para garantizar su seguridad e integridad.</p>
  <span class="badge">Datos médicos no disponibles sin conexión</span>
  <br/>
  <button onclick="window.location.reload()">Reintentar conexión</button>
</body>
</html>
